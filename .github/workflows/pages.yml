name: Playground and guide

# Builds the wasm module into playground/pkg and the guide (book/, mdBook)
# into docs/, and deploys both to GitHub Pages: the playground at
# https://iamsaquib8.github.io/domq/ and the guide at .../domq/docs/.
# One-time setup: in the repo settings, Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wasm/**"
      - "playground/**"
      - "book/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,mdbook
      - name: Build the wasm module into playground/pkg
        working-directory: wasm
        run: wasm-pack build --target web --release --no-pack --out-dir ../playground/pkg
      - name: Report the module size
        run: |
          echo "wasm: $(wc -c < playground/pkg/domq_wasm_bg.wasm) bytes," \
               "$(gzip -9 -c playground/pkg/domq_wasm_bg.wasm | wc -c) gzipped"
      - name: Assemble the site (playground at /, guide at /docs/)
        run: |
          mkdir -p _site
          cp -R playground/. _site/
          mdbook build book --dest-dir ../_site/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
