[package]
name = "domq-conformance"
version = "0.0.0"
publish = false
edition = "2024"
default-run = "conformance"
description = "Measures domq against external test suites: the HTML tree-construction tests (docs/conformance.md) and Readability's labelled pages (docs/reader-mode.md)."

# Independent crate (excluded from the main workspace), like benchmarks/ and
# fuzz/. The empty `[workspace]` keeps cargo from looking further up.
[workspace]

[dependencies]
domq = { path = "..", default-features = false }
# Reads Readability's expected-metadata.json (this crate is never published).
serde_json = "1"

[[bin]]
name = "conformance"
path = "src/main.rs"

[[bin]]
name = "reader"
path = "src/bin/reader.rs"
