[package]
name = "domq-conformance"
version = "0.0.0"
publish = false
edition = "2024"
default-run = "conformance"
description = "Measures domq against external test suites: the HTML tree-construction tests (docs/conformance.md), Readability's pages (docs/reader-mode.md) and the AEB and WCXB extraction benchmarks (docs/reader-quality.md)."

# Independent crate (excluded from the main workspace), like benchmarks/ and
# fuzz/. The empty `[workspace]` keeps cargo from looking further up.
[workspace]

[dependencies]
domq = { path = "..", default-features = false }
# Reads the benchmarks' JSON (this crate is never published).
serde_json = "1"
# The AEB and WCXB pages are gzipped.
flate2 = "1"

[[bin]]
name = "conformance"
path = "src/main.rs"

[[bin]]
name = "reader"
path = "src/bin/reader.rs"

[[bin]]
name = "quality"
path = "src/bin/quality.rs"
